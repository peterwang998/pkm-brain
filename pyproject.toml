[project]
name = "pkm-brain"
version = "0.1.0"
description = "Local personal knowledge management and agent memory tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lancedb>=0.30.2",
    "mcp>=1.27.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentence-transformers>=5.4.1",
    "typer>=0.25.1",
]

[project.scripts]
brain = "pkm_brain:main"
pkm-brain = "pkm_brain:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
