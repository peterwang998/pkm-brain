[project]
name = "pkm-brain"
version = "0.1.0"
description = "Local-first personal knowledge management and agent memory for MCP-aware coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Peter Wang" },
]
keywords = [
    "agent-memory",
    "codex",
    "claude",
    "lancedb",
    "local-first",
    "mcp",
    "personal-knowledge-management",
    "sqlite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "lancedb>=0.30.2",
    "mcp>=1.27.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.4.1",
]

[project.scripts]
brain = "pkm_brain:main"
pkm-brain = "pkm_brain:main"
brain-mcp = "pkm_brain.mcp_proxy:main"

[project.urls]
Homepage = "https://github.com/peterwang998/pkm-brain"
Repository = "https://github.com/peterwang998/pkm-brain"
Issues = "https://github.com/peterwang998/pkm-brain/issues"
Documentation = "https://github.com/peterwang998/pkm-brain#readme"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
